# Vista previa de ULIT Censo en Vercel: SOLO PREVIEW, nunca producción.
# Se ejecuta únicamente al publicar en la rama de desarrollo indicada. No hay integración Git de Vercel,
# así que `main` nunca se despliega. Antes de publicar se pasan TypeScript, las pruebas y el control de
# datos reales; se publica exactamente lo compilado aquí.
name: Vista previa en Vercel (pruebas)

on:
  push:
    branches: ['claude/fase2-oficina-itinerarios']

permissions:
  contents: read

concurrency:
  group: preview-vercel
  cancel-in-progress: true

env:
  VERCEL_CLI: vercel@63.1.0
  PROYECTO: ulit-censo-pruebas
  DIRECCION_FIJA: ulit-censo-pruebas-vista.vercel.app
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Control de datos reales
        run: npm run comprobar-datos
      - name: Compilación
        run: npm run build
      - name: Preparar la salida (solo archivos previstos, huellas comprobadas)
        run: node scripts/vercel/preparar-vercel.mjs
      - name: Desplegar PREVIEW protegida
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/vercel/desplegar-preview.sh
