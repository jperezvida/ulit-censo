name: Preflight Medina 2025 - comprobaciones sin despliegue

# Comprobación específica de la rama de preparación.
# No contiene secretos, no ejecuta migraciones y no despliega.
on:
  push:
    branches:
      - codex/preflight-medina-2025-controlado
  pull_request:
    branches:
      - claude/persistencia-supabase-diseno

permissions:
  contents: read

jobs:
  preflight:
    name: TypeScript, pruebas y control de datos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run comprobar-datos
      - run: npm run build
